name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

jobs:
  verify-ci:
    name: Reuse successful exact-SHA CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful push CI for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ci_run=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_sha == "'"$GITHUB_SHA"'" and .status == "completed" and .conclusion == "success")] | sort_by(.updated_at) | last | select(. != null) | [.id, .head_sha, .conclusion, .updated_at, .html_url] | @tsv')
          test -n "$ci_run" || { echo "no successful completed CI push run for $GITHUB_REPOSITORY@$GITHUB_SHA" >&2; exit 1; }
          IFS=$'\t' read -r run_id run_sha conclusion completed_at run_url <<< "$ci_run"
          test "$run_sha" = "$GITHUB_SHA"
          test "$conclusion" = success
          printf 'Reusing CI run %s completed at %s: %s\n' "$run_id" "$completed_at" "$run_url"
          printf 'Reused successful exact-SHA CI: [%s](%s)\n' "$run_id" "$run_url" >> "$GITHUB_STEP_SUMMARY"

  signing-admission:
    name: Require qualified platform signing
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unsigned CLI publication
        run: |
          echo "assign-cli publication is blocked until the workflow signs and notarizes both macOS executables and Authenticode-signs both Windows executables." >&2
          exit 1

  release:
    needs: [verify-ci, signing-admission]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: terminal/package-lock.json
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 1.4.2
      - name: Validate unprefixed Semantic Version tag
        run: |
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
      - name: Require tap publishing token
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: test -n "$HOMEBREW_TAP_GITHUB_TOKEN"
      - name: Build terminal Discuss sidecars
        working-directory: terminal
        run: |
          npm ci
          npm run typecheck
          npm test
          npm audit --audit-level=moderate
          ./build-all.sh
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Verify paired archives, size budget, and SBOMs
        run: ./scripts/verify-release-archives.sh
      - name: Attest exact release checksums
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/assign_${{ github.ref_name }}_SHA256SUMS
