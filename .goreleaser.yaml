version: 2

project_name: assign

builds:
  - id: assign
    main: .
    binary: assign
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/assignso/assign-cli/internal/cli.version={{ .Version }}
        -X github.com/assignso/assign-cli/internal/cli.commit={{ .Commit }}
        -X github.com/assignso/assign-cli/internal/cli.date={{ .Date }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: assign
    ids:
      - assign
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: assign_{{ .Version }}_SHA256SUMS
  algorithm: sha256

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  prerelease: auto
  github:
    owner: assignso
    name: homebrew-tap

homebrew_casks:
  - name: assign
    ids:
      - assign
    binaries:
      - assign
    directory: Casks
    repository:
      owner: assignso
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: Assign Release Bot
      email: releases@assign.so
    homepage: https://assign.so
    description: Work with Assign from the terminal
    skip_upload: false
